  project_id: 1
  tracker_id: 3
  name: Support request
  initial_credit_days: 20
  anniversary_month: 1
  anniversary_day: 1
  active_from: 2026-01-01
  enabled: true

# Ends with 2026: no grant in 2027.
ecookbook_bug:
  id: 3
  project_id: 1
  tracker_id: 1
  name: Bug
  initial_credit_days: 10
  anniversary_month: 1
  anniversary_day: 1
  active_from: 2026-01-01
  active_until: 2026-12-31
  enabled: true

# Subproject with its own contract year, starting in April.
